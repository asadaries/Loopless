<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loopless · Library</title>
<link rel="stylesheet" href="ui.css">
<style>
  .wrap{max-width:900px;margin:0 auto;padding:20px 20px 48px}
  header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:4px 0 18px;flex-wrap:wrap}
  h1{font-size:24px;margin-bottom:2px}
  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .bar .grow{flex:1}
  .takes li{flex-wrap:wrap;padding:12px 0}
  .takes .status{font-size:12px;color:var(--muted);margin-top:2px}
  .takes .status a{color:var(--accent);font-weight:600}
  .row-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .row-progress{flex-basis:100%;margin-left:17px}
  .row-error{flex-basis:100%;margin-left:17px}
  .empty{padding:32px 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand"><span class="brand-dot" aria-hidden="true"></span>Loopless</div>
    </div>
    <span class="muted" id="driveLabel"></span>
  </header>

  <h1>All recordings</h1>
  <div class="bar">
    <span class="muted" id="summary"></span>
    <span class="grow"></span>
    <a class="link" id="driveFolder" href="#" target="_blank" rel="noopener" hidden>Open Drive folder</a>
    <label class="check"><input type="checkbox" id="share">Anyone with the link can view</label>
    <button class="btn primary" id="uploadAllBtn" hidden>Upload all</button>
  </div>
  <p class="error" id="error" role="alert" hidden></p>

  <ul class="takes" id="takes"></ul>
  <p class="muted empty" id="takesEmpty" hidden>Nothing recorded yet.</p>
</div>

<script src="lib/db.js"></script>
<script src="lib/drive.js"></script>
<script src="library.js"></script>
</body>
</html>
